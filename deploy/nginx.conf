# ======================================================
# Nginx — إعداد بيلادجيو للإنتاج
# ضع هذا الملف في: /etc/nginx/sites-available/bellagio
# ثم: sudo ln -s /etc/nginx/sites-available/bellagio /etc/nginx/sites-enabled/
# ======================================================

# إعادة توجيه HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    # Let's Encrypt يحتاج هذا المسار للتجديد
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# خادم HTTPS الرئيسي
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP;

    # === شهادة SSL (certbot يضيفها تلقائياً) ===
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # === ترويسات الأمان ===
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # === ضغط gzip ===
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/manifest+json;
    gzip_comp_level 6;
    gzip_min_length 500;

    # === توجيه جميع الطلبات إلى FastAPI ===
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # مهلة كافية لعمليات توليد PDF وتصدير QR التي قد تستغرق وقتاً
        # proxy_read_timeout: وقت انتظار nginx لأول بايت من FastAPI
        # proxy_send_timeout: وقت إرسال البيانات الكاملة للمتصفح
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;

        # منع nginx من تخزين ردود PDF مؤقتاً (تُرسَل مباشرة للمتصفح)
        proxy_buffering off;

        # حجم الملفات المرفوعة (صور المنتجات)
        client_max_body_size 10M;
    }

    # === مسارات PDF وQR بمهلة أطول صراحةً ===
    location ~ ^/products/(export-pdf|all|variant|product) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # طلبات PDF تحتاج وقتاً أطول بكثير
        proxy_read_timeout    600s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    600s;
        proxy_buffering off;

        client_max_body_size 10M;
    }


    # === تخزين مؤقت للملفات الثابتة (صور/QR/خطوط) ===
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_set_header Host $host;
    }

    # === ملفات PWA بترويسات صحيحة ===
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        proxy_pass http://127.0.0.1:8000/manifest.json;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }
}
